<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connecting... - Brother Printer Setup</title>

    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">

    <!-- FontAwesome CDN for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
        integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-color: #fcfcfc;
        }

        /* Top Navigation Header */
        .header-top {
            background-color: #ffffff;
            border-bottom: 1px solid #e0e0e0;
            padding: 15px 0;
        }

        /* Loading Area Container */
        .loading-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .loading-card {
            background: #ffffff;
            padding: 60px 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        /* Custom CSS Spinner */
        .custom-spinner {
            width: 70px;
            height: 70px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #005cab;
            /* HP Blue */
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 30px auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* Pulsing Text Effect */
        .loading-title {
            font-size: 1.75rem;
            font-weight: 300;
            color: #333;
            margin-bottom: 15px;
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0% {
                opacity: 0.7;
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: 0.7;
            }
        }

        .loading-subtitle {
            font-size: 1rem;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .printer-icon-bg {
            color: #e9ecef;
            font-size: 4rem;
            margin-bottom: -20px;
            position: relative;
            z-index: 0;
        }

        .cancel-link {
            color: #005cab;
            text-decoration: none;
            font-size: 0.95rem;
        }

        .cancel-link:hover {
            text-decoration: underline;
            color: #005cab;
        }

        /* Footer */
        .footer {
            background-color: #404040;
            color: #d1d1d1;
            padding: 20px 0;
            font-size: 0.8rem;
            margin-top: auto;
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header class="header-top">
        <div class="container d-flex justify-content-center justify-content-md-start">
            <a href="javascript:void(0);" class="hp-logo">
                <img src="logo.svg" />
            </a>
        </div>
    </header>

    <!-- Main Content (Loading Status) -->
    <main class="loading-container">
        <div class="loading-card position-relative overflow-hidden">

            <!-- Faint background printer icon -->
            <i
                class="fa-solid fa-print printer-icon-bg position-absolute top-0 start-50 translate-middle-x mt-4 opacity-50"></i>

            <div class="position-relative" style="z-index: 1;">
                <!-- Animated Spinner -->
                <div class="custom-spinner"></div>

                <!-- Loading Text -->
                <h2 class="loading-title">Finding your printer...</h2>
                <p class="loading-subtitle">
                    Please do not refresh or close this page. We are preparing the recommended software and drivers for
                    your specific model.
                </p>

                <!-- Optional Action (Mock Link) -->
                <div class="mt-4 pt-3 border-top">
                    <a href="javascript:void(0);" class="cancel-link">
                        Loading, Please Be Patient
                    </a>
                </div>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p class="mb-0 text-center text-md-start">
                ©2026 Brother Industries, Ltd. All Rights Reserved. The information contained herein is subject to
                change without notice.
            </p>
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>

    <!-- Optional: Script to simulate a redirect after loading finishes -->
    <script>
        // Simulates the loading process. In a real scenario, this would redirect 
        // to the success or download page after backend processing is done.
        setTimeout(function () {
            console.log("Loading complete. Ready to redirect to download page.");
            window.location.href = "error.html";
        }, 5000);
    </script>
</body>

</html>
